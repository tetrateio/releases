name: pypi

# Publishes the PyPI wheels of a promoted tetrate release: one per platform,
# each holding the binary and no Python code. tools/wheel builds them from the
# public release files and checks each binary's sha256 and sigstore signature
# first. PyPI trusted publishing exchanges the publish job's OIDC token for a
# short-lived upload token, so no PyPI secret exists. The publish job runs in
# the pypi environment, which waits for a reviewer. A version that is on PyPI
# already is skipped, so a rerun is safe.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: The promoted tetrate version, such as v0.1.0-alpha.3
        required: true

permissions: {}

concurrency:
  group: pypi
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'tetrate/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: Build the wheels
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version=${INPUT_VERSION:-${RELEASE_TAG#tetrate/}}
          case $version in
          v[0-9]*) ;;
          *) echo "::error::$version is not a tetrate version"; exit 1 ;;
          esac
          case $version in
          *[!A-Za-z0-9._+-]*) echo "::error::$version has a character that a version does not have"; exit 1 ;;
          esac
          go run ./tools/wheel -product tetrate -version "$version" -out out/pypi -cosign
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels
          path: out/pypi/*.whl
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/tetrate/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
          skip-existing: true
          attestations: true
